name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Check tag version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $($env:RELEASE_TAG) does not match version.txt $version"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer and updater
        shell: cmd
        run: build-release.bat

      - name: Stage ASCII-named installer
        shell: pwsh
        run: Copy-Item "dist\报告生成工具-Setup.exe" "dist\report-generator-Setup.exe" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/report-generator-Setup.exe

      - name: Ensure legacy Chinese asset via API (correct UTF8 name)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $headers = @{"Authorization"="Bearer $env:GH_TOKEN"; "Accept"="application/vnd.github+json"; "User-Agent"="release-legacy-fix"}
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers $headers -TimeoutSec 20
          $hasLegacy = $false
          foreach ($a in $rel.assets) { if ($a.name -eq "报告生成工具-Setup.exe") { $hasLegacy = $true; break } }
          if ($hasLegacy) {
            Write-Host "Legacy asset already present"
            exit 0
          }
          Write-Host "Legacy asset missing, uploading via API with UTF8 name..."
          $uploadUrl = ($rel.upload_url -replace "\{\?name,label\}", "")
          $encodedName = [System.Uri]::EscapeDataString("报告生成工具-Setup.exe")
          $uri = "${uploadUrl}?name=${encodedName}"
          $filePath = "dist/报告生成工具-Setup.exe"
          $bytes = [System.IO.File]::ReadAllBytes($filePath)
          $resp = Invoke-RestMethod -Uri $uri -Method Post -Headers @{"Authorization"="Bearer $env:GH_TOKEN"; "Content-Type"="application/octet-stream"; "User-Agent"="release-legacy-fix"} -Body $bytes -TimeoutSec 120
          Write-Host "Legacy upload done: $($resp.name) id $($resp.id)"
