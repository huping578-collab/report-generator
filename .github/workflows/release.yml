name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Check tag version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $($env:RELEASE_TAG) does not match version.txt $version"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer and updater
        shell: cmd
        run: build-release.bat

      - name: Stage ASCII-named installer
        shell: pwsh
        run: Copy-Item "dist\报告生成工具-Setup.exe" "dist\report-generator-Setup.exe" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/report-generator-Setup.exe

      # GitHub may normalize non-ASCII filenames; keep the updater filename
      # stable and use the asset label for the Chinese display name.
      - name: Label and verify installer asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = [System.Uri]::EscapeDataString($env:RELEASE_TAG)
          $headers = @{"Authorization"="Bearer $env:GH_TOKEN"; "Accept"="application/vnd.github+json"; "User-Agent"="release-verify"}
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $rel = Invoke-RestMethod -Uri "$api/releases/tags/$tag" -Headers $headers -TimeoutSec 30
          $name = 'report-generator-Setup.exe'
          $label = '报告生成工具-Setup.exe'
          $assets = @(Invoke-RestMethod -Uri "$api/releases/$($rel.id)/assets?per_page=100" -Headers $headers -TimeoutSec 30)
          $matches = @($assets | Where-Object { $_.name -eq $name })
          if ($matches.Count -ne 1) { throw "Expected exactly one $name asset" }
          $asset = $matches[0]
          $body = [System.Text.Encoding]::UTF8.GetBytes((@{name=$name; label=$label} | ConvertTo-Json -Compress))
          $null = Invoke-RestMethod -Uri "$api/releases/assets/$($asset.id)" -Method Patch -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $body -TimeoutSec 30
          $verified = Invoke-RestMethod -Uri "$api/releases/assets/$($asset.id)" -Headers $headers -TimeoutSec 30
          $file = Get-Item "dist/$name"
          $digest = 'sha256:' + (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($verified.name -ne $name -or $verified.label -ne $label -or $verified.state -ne 'uploaded' -or $verified.size -ne $file.Length -or $verified.digest -ne $digest) {
            throw 'Release asset verification failed (name, label, state, size or digest)'
          }
          Write-Host "Verified $($verified.name) id=$($verified.id) size=$($verified.size) digest=$($verified.digest)"
